name: lifefitai

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lifefitai-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  database-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "IF DB_ID(N'LifeFitAI') IS NULL CREATE DATABASE LifeFitAI;"
    restart: "no"

  liquibase:
    build:
      context: ./database
      dockerfile: Dockerfile
    depends_on:
      database-init:
        condition: service_completed_successfully
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:sqlserver://sqlserver:1433;databaseName=LifeFitAI;encrypt=false;trustServerCertificate=true
      LIQUIBASE_COMMAND_USERNAME: sa
      LIQUIBASE_COMMAND_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: lifefitai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: lifefitai-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SqlServer: Server=sqlserver,1433;Database=LifeFitAI;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required};TrustServerCertificate=True;Encrypt=False
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      Jwt__Issuer: LifeFitAI
      Jwt__Audience: LifeFitAI
    ports:
      - "8080:8080"
    volumes:
      - dataprotection:/var/lifefit/dataprotection
    restart: unless-stopped

volumes:
  sqlserver-data:
  dataprotection:
