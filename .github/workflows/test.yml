name: test

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Backend restore, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore backend/LifeFitAI.sln

      - name: Build
        run: dotnet build backend/LifeFitAI.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/LifeFitAI.sln --configuration Release --no-build
